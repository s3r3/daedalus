[package]
name = "dae-captain"
version = "0.1.0"
description = "Dae Captain — dynamic-island companion that drives all Daedalus agentic engines"
authors = ["Farid Arian"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[features]
# default = [ "custom-protocol" ]
# Uncomment this to enable the custom protocol feature, which is required for
# full CSP lockdown in production builds.
# custom-protocol = [ "tauri/custom-protocol" ]
