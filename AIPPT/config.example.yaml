# AI PPT 生成器配置文件示例
# 复制此文件为 config.yaml 并填入你的 API 配置

# API 配置
api:
  # 模型配置。后端会优先读取这里，前端只负责选择/覆盖 profile。
  # 调用协议：当前支持 OpenAI-compatible /chat/completions。
  # - text_model: 文本 chat completion；省略时可继承 VLM
  # - image_model/edit_model: 多模态 chat completion，响应需返回图片 URL、data URL 或 base64
  # - VLM: 可选，多模态理解模型；仅在整页图片转可编辑 PPTX 时需要
  # - ocr_model: 可选，OCR 模型；仅在整页图片转可编辑 PPTX 时需要，响应需返回结构化 OCR JSON
  models:
    text_model:
      api_key: "your-text-api-key"
      base_url: "https://api.example.com/v1"
      model: "DeepSeek-V4-Pro"
      thinking: "disabled"  # 可选: "enabled", "disabled"
    image_model:
      api_key: "your-image-api-key"
      base_url: "https://api.example.com/v1"
      model: "gpt-image-2"
    # 可省略；省略时默认继承 image_model
    edit_model:
      api_key: "your-edit-api-key"
      base_url: "https://api.example.com/v1"
      model: "gpt-image-2"
    VLM:
      api_key: "your-vlm-api-key"
      base_url: "https://api.example.com/v1"
      model: "gpt-5.5"
    ocr_model:
      api_key: "your-ocr-api-key"
      base_url: "https://ocr.example.com/v1"
      model: "PaddleOCR-VL-1.6"

# 生成式可编辑 PPTX 导出配置：这里引用上面的模型角色，不直接写密钥
generative_editable_pptx:
  reconstruction:
    mode: "vlm_first"
    clean_base_model: "edit_model"
    asset_sheet_model: "edit_model"
    repair_model: "edit_model"
    generation_model: "image_model"
  ocr:
    model: "ocr_model"
    use_aippt_metadata_first: true
    min_confidence: 0.75
  quality:
    max_repair_attempts: 2
    preview_similarity_threshold: 0.92
    require_preview_validation: true
  retries:
    provider_max_attempts: 2
    repair_max_attempts: 2
    backoff_seconds: 1.0
  timeouts:
    provider_call: 180
    page: 600

# PPT 默认配置
ppt:
  language: "中文"
  style: "现代简约商务风格"
  target_audience: "专业人士"
  num_pages: 10
  aspect_ratio: "16:9"  # 可选: "16:9", "4:3", "1:1"
  quality: "2K"         # 可选: "1K", "2K", "4K"
  max_concurrent: 3     # 并发生成数量
  max_retries: 3        # 重试次数
  retry_delay: 2.0      # 重试间隔（秒）

# 超时配置
timeout:
  text_generation: 120    # 文本生成超时（秒）
  image_generation: 180   # 单个图像生成超时（秒）
  api_call: 60           # 单次API调用超时（秒）
  batch_buffer: 60        # 流水线并发额外缓冲时间（秒）
  # 说明：总超时 = ceil(任务数/并发数) × 单个超时 + 缓冲时间

# 输出配置
output:
  dir: "output"

# 文档配置
doc:
  dir: "doc"
  sample_file: "L9.md"
