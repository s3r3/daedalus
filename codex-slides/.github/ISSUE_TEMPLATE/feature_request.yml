name: Feature request
description: Propose a visible, agent-operable presentation workflow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to see and do?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed Browser workflow
      description: Where should this appear in the visible project flow?
  - type: textarea
    id: parity
    attributes:
      label: Skill, CLI, and MCP considerations
      description: Which non-UI surfaces should expose the same capability?
